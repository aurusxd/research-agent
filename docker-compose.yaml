services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16
    container_name: PostgreSQL
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  bot:
    build:
      context: .
      target: bot

    restart: always

    env_file:
      - .env

    depends_on:
      - db
      - api
  api:
    build:
      context: .
      target: runtime
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./vk_auth.json:/app/vk_auth.json:ro
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
  migrations:
    build:
      context: .
      target: runtime
    command: uv run alembic upgrade head
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      - db

  celery-email:
    build:
      context: .
      target: runtime
    command: uv run celery -A worker.celery_app:celery_app worker -Q mailing_email,maintenance --concurrency=1 --loglevel=INFO
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  celery-search:
    build:
      context: .
      target: runtime
    command: uv run celery -A worker.celery_app:celery_app worker -Q search --concurrency=1 --loglevel=INFO
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  celery-telegram:
    build:
      context: .
      target: runtime
    command: >
      uv run celery
      -A worker.celery_app:celery_app worker
      -Q mailing_telegram
      --concurrency=1
      --loglevel=INFO
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./telegram-session:/app/telegram-session
    
    restart: always

  celery-vk:
    build:
      context: .
      target: runtime
    command: uv run celery -A worker.celery_app:celery_app worker -Q mailing_vk --concurrency=1 --loglevel=INFO
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./vk_auth.json:/app/vk_auth.json:ro
      - ./vk-profile:/app/vk-profile
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  celery-contact-form:
    build:
      context: .
      target: runtime
    command: uv run celery -A worker.celery_app:celery_app worker -Q mailing_contact_form --concurrency=1 --loglevel=INFO
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  celery-ok:
    build:
      context: .
      target: runtime
    command: uv run celery -A worker.celery_app:celery_app worker -Q mailing_ok --concurrency=1 --loglevel=INFO
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./ok_auth.json:/app/ok_auth.json:ro
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  celery-beat:
    build:
      context: .
      target: runtime
    command: uv run celery -A worker.celery_app:celery_app beat --loglevel=INFO
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  integration-tests:
    profiles: ["test"]
    build:
      context: .
      target: runtime
    command: uv run python -m unittest tests.test_celery_integration -v
    env_file:
      - .env
    environment:
      RUN_INTEGRATION_TESTS: "1"
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      celery-email:
        condition: service_started
      celery-search:
        condition: service_started
      celery-telegram:
        condition: service_started
      celery-vk:
        condition: service_started
      celery-contact-form:
        condition: service_started
      celery-ok:
        condition: service_started

volumes:
  redis_data:
